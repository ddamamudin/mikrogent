<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Offline · LintasAgent</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="/favicon-32.png" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #fff;
        color: #111827;
      }
      .wrap {
        text-align: center;
        padding: 32px 20px;
        max-width: 360px;
      }
      img { width: 80px; height: 80px; opacity: 0.9; }
      h1 { font-size: 1.25rem; margin: 16px 0 8px; font-weight: 600; }
      p { font-size: 0.875rem; color: #6b7280; line-height: 1.55; margin: 0 0 20px; }
      button {
        appearance: none;
        border: none;
        background: #111827;
        color: #fff;
        font: inherit;
        font-size: 0.875rem;
        padding: 10px 18px;
        border-radius: 999px;
        cursor: pointer;
      }
      button:hover { background: #374151; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="/icon-192.png" alt="LintasAgent" />
      <h1>Tidak ada koneksi</h1>
      <p>Sambungkan internetmu untuk lanjut chat dengan LintasAgent.</p>
      <button onclick="location.reload()">Coba lagi</button>
    </div>
  </body>
</html>
